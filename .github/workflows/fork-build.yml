name: Fork build (debug APK)

# Fork-friendly build: produces an unsigned-for-release, debug-signed APK.
# It needs no repository secrets (PostHog / SteamGridDB / cloud project number
# all fall back to empty strings in app/build.gradle.kts).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build legacy debug APK
      run: ./gradlew :app:assembleLegacyDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gamenative-legacy-debug
        path: app/build/outputs/apk/legacy/debug/*.apk
        if-no-files-found: error
        retention-days: 14
